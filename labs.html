<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function add() {
            const num1 = document.querySelector("#num1").value;
            const num2 = document.querySelector("#num2").value;
            const result = Number(num1) + Number(num2);

            document.querySelector("#result").value = result;
        }

        function clickMe() {
            //const btn = document.getElementById("clickBtn");
            const btn = document.querySelector("#clickBtn");
            btn.innerHTML = "<h1>Clicked!</h1>";
            alert("버튼이 클릭되었습니다.");
        }

        window.addEventListener("load", function(){
            const clickBtn2 = document.querySelector("#clickBtn2");
            clickBtn2.addEventListener("click", function(event){
                clickBtn2.innerHTML = "<h1>버튼이 클릭되었습니다.</h1>";
            })
        })
    </script>

    <style>
        h1 {
            color: rgb(151, 77, 224);
        }
    </style>
</head>
<body>
    <!-- 클릭버튼 실습 -->
    <h3>Internal JS</h3>
    <button id="clickBtn2">Click Me</button>

    <!-- 클릭버튼 실습 -->
    <h3>Inline JS</h3>
    <div id="clickBtn" onclick="clickMe()">Click Me</div>

    <!-- 계산기 -->
    <h1>덧셈 계산기</h1>
    <input type="text" id="num1" size="4" />
    <input type="text" id="num2" size="4" />
    <button id="addBtn">+</button>
    <input id="result" readonly />
</body>
</html>
